# ============================================================
# Nav2 parameters for autonomous golf trolley
# ROS 2 Jazzy + Gazebo + saved map navigation
#
# Controller:
#   Regulated Pure Pursuit (RPP) Controller
#
# Sensors and topics:
#   /scan
#   /odom
#   /cmd_vel
#   base_link
#
# Navigation features:
#   - AMCL localization using saved map
#   - LiDAR obstacle detection in local and global costmaps
#   - RPP controller for regulated path tracking and collision checking
# ============================================================


# ============================================================
# AMCL LOCALIZATION
# ============================================================

amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: /scan

    tf_broadcast: true
    transform_tolerance: 1.0

    set_initial_pose: true
    always_reset_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 60

    z_hit: 0.8
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1
    sigma_hit: 0.2
    lambda_short: 0.1

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    update_min_d: 0.25
    update_min_a: 0.2


# ============================================================
# SAVED MAP SERVER
# ============================================================

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/adriantee/ros2_ws/maps/golf_course_map_new.yaml"


map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true


# ============================================================
# BEHAVIOR TREE NAVIGATOR
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"


# ============================================================
# CONTROLLER SERVER
# Regulated Pure Pursuit Controller
# ============================================================

controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    odom_topic: /odom

    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.50

      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.50

      use_velocity_scaled_lookahead_dist: true

      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.00
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.00

      allow_reversing: false

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.00

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.00

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.15

      use_cost_regulated_linear_velocity_scaling: true

      cost_scaling_dist: 0.40
      cost_scaling_gain: 1.00
      inflation_cost_scaling_factor: 3.00

      transform_tolerance: 0.20

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.00

      max_robot_pose_search_dist: 10.00
      interpolate_curvature_after_goal: false


# ============================================================
# GLOBAL PLANNER
# ============================================================

planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false


# ============================================================
# PATH SMOOTHER
# ============================================================

smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 100
      do_refinement: true


# ============================================================
# RECOVERY / NAVIGATION BEHAVIORS
# ============================================================

behavior_server:
  ros__parameters:
    use_sim_time: true

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    local_frame: "odom"
    global_frame: "map"
    robot_base_frame: "base_link"

    transform_tolerance: 0.2
    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0


# ============================================================
# LOCAL COSTMAP
# Reacts quickly to nearby LiDAR obstacles
# ============================================================

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "odom"
      robot_base_frame: "base_link"

      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      robot_radius: 0.25

      update_frequency: 20.0
      publish_frequency: 10.0

      transform_tolerance: 0.3

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_max_range: 4.0
          obstacle_min_range: 0.0

          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          
          
          observation_persistence: 0.0
          expected_update_rate: 0.05
          inf_is_valid: true

          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


# ============================================================
# GLOBAL COSTMAP
# Uses saved map + LiDAR obstacle layer
# ============================================================

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "map"
      robot_base_frame: "base_link"

      robot_radius: 0.25

      resolution: 0.05
      track_unknown_space: true

      update_frequency: 20.0
      publish_frequency: 10.0

      transform_tolerance: 0.3

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_max_range: 3.0
          obstacle_min_range: 0.0

          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          
          observation_persistence: 0.0
          expected_update_rate: 0.05
          inf_is_valid: true

          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.60
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


# ============================================================
# WAYPOINT FOLLOWER
# ============================================================

waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


# ============================================================
# VELOCITY SMOOTHER
# ============================================================

velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]

    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0
