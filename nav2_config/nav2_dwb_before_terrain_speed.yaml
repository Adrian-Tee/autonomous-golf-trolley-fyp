# ============================================================
# Nav2 parameters for autonomous golf trolley
# ROS 2 Jazzy + Gazebo + saved map navigation
#
# Controller:
#   Regulated Pure Pursuit (RPP) Controller
#
# Sensors and topics:
#   /scan
#   /odom
#   /cmd_vel
#   base_link
#
# Navigation features:
#   - AMCL localization using saved map
#   - LiDAR obstacle detection in local and global costmaps
#   - RPP controller for regulated path tracking and collision checking
# ============================================================


# ============================================================
# AMCL LOCALIZATION
# ============================================================

amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: /scan

    tf_broadcast: true
    transform_tolerance: 1.0

    set_initial_pose: true
    always_reset_initial_pose: true

    initial_pose:
      x: 0.203
      y: 8.001
      z: 0.0
      yaw: 0.035

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 60

    z_hit: 0.8
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1
    sigma_hit: 0.2
    lambda_short: 0.1

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    update_min_d: 0.25
    update_min_a: 0.2


# ============================================================
# SAVED MAP SERVER
# ============================================================

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/adriantee/ros2_ws/maps/golf_course_map_new.yaml"


map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true


# ============================================================
# BEHAVIOR TREE NAVIGATOR
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"


# ============================================================
# CONTROLLER SERVER
# Regulated Pure Pursuit Controller
# ============================================================

controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    odom_topic: /odom

    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.20
      max_vel_y: 0.0
      max_vel_theta: 1.00

      min_speed_xy: 0.0
      max_speed_xy: 1.20
      min_speed_theta: 0.0

      acc_lim_x: 1.00
      acc_lim_y: 0.0
      acc_lim_theta: 1.00

      decel_lim_x: -1.00
      decel_lim_y: 0.0
      decel_lim_theta: -1.00

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ============================================================
# GLOBAL PLANNER
# ============================================================

planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false


# ============================================================
# PATH SMOOTHER
# ============================================================

smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 100
      do_refinement: true


# ============================================================
# RECOVERY / NAVIGATION BEHAVIORS
# ============================================================

behavior_server:
  ros__parameters:
    use_sim_time: true

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    local_frame: "odom"
    global_frame: "map"
    robot_base_frame: "base_link"

    transform_tolerance: 0.2
    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0


# ============================================================
# LOCAL COSTMAP
# Reacts quickly to nearby LiDAR obstacles
# ============================================================

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "odom"
      robot_base_frame: "base_link"

      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      robot_radius: 0.25

      update_frequency: 20.0
      publish_frequency: 10.0

      transform_tolerance: 0.3

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_max_range: 4.0
          obstacle_min_range: 0.0

          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          
          
          observation_persistence: 0.0
          expected_update_rate: 0.05
          inf_is_valid: true

          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


# ============================================================
# GLOBAL COSTMAP
# Uses saved map + LiDAR obstacle layer
# ============================================================

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "map"
      robot_base_frame: "base_link"

      robot_radius: 0.25

      resolution: 0.05
      track_unknown_space: true

      update_frequency: 20.0
      publish_frequency: 10.0

      transform_tolerance: 0.3

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_max_range: 3.0
          obstacle_min_range: 0.0

          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          
          observation_persistence: 0.0
          expected_update_rate: 0.05
          inf_is_valid: true

          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.60
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


# ============================================================
# WAYPOINT FOLLOWER
# ============================================================

waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


# ============================================================
# VELOCITY SMOOTHER
# ============================================================

velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity: [1.2, 0.0, 1.0]
    min_velocity: [-1.2, 0.0, -1.0]

    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0
